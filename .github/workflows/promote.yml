# Promotion PRs: dev deploys automatically; stage and prod change only when a human merges a PR.
#
# Whenever dev or stage changes on main, this keeps one PR per service and target env in sync:
#   promote/<service>-stage   dev   → stage   (merge = stage checkpoint)
#   promote/<service>-prod    stage → prod    (merge = prod checkpoint; CODEOWNERS review on envs/prod/)
# The PR always carries the newest candidate; it is closed automatically once the target runs it.
# Run it manually to (re)create PRs for one service or env.
name: promote
run-name: ${{ github.event_name == 'workflow_dispatch' && format('promote {0} → {1}', inputs.service, inputs.target) || 'sync promotion PRs' }}

on:
  push:
    branches: [main]
    paths:
      - envs/dev/*/kustomization.yaml
      - envs/stage/*/kustomization.yaml
  workflow_dispatch:
    inputs:
      service:
        description: Service
        type: choice
        options: [all, orders, catalog]
        default: all
      target:
        description: Target environment
        type: choice
        options: [all, stage, prod]
        default: all

permissions:
  contents: read

# One reconciliation at a time; a newer run supersedes a pending one (it reads the latest main anyway)
concurrency:
  group: promotion-prs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # The PAT (not GITHUB_TOKEN) pushes and opens PRs, so pr-checks runs on them
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Sync promotion PRs
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          SERVICE: ${{ inputs.service || 'all' }}
          TARGET: ${{ inputs.target || 'all' }}
          REQUESTED_BY: ${{ github.event_name == 'workflow_dispatch' && github.triggering_actor || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in apps/*/; do
            svc=$(basename "$dir")
            [[ $SERVICE == all || $SERVICE == "$svc" ]] || continue
            for pair in dev:stage stage:prod; do
              from=${pair%:*} to=${pair#*:}
              [[ $TARGET == all || $TARGET == "$to" ]] || continue
              scripts/promotion-pr.sh "$svc" "$from" "$to" ${REQUESTED_BY:+--requested-by "$REQUESTED_BY"} \
                | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
