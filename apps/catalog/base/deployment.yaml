apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
    spec:
      containers:
        - name: app
          image: catalog            # placeholder, replaced by the images: entry in envs/<env>/catalog
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 448Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: catalog-config    # generated per env; Kustomize rewrites this to the hashed name
