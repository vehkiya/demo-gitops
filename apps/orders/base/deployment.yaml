apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      containers:
        - name: app
          image: orders             # placeholder, replaced by the images: entry in envs/<env>/orders
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          envFrom:
            - secretRef:
                name: orders-secrets   # created by External Secrets from envs/<env>/orders/external-secret.yaml
                optional: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: orders-config     # generated per env; Kustomize rewrites this to the hashed name
