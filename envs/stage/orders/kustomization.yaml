apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/orders/base
  - external-secret.yaml
images:
  # Updated by CI (dev) and the promote workflow (stage, prod). Don't edit by hand.
  - name: orders
    newName: ghcr.io/vehkiya/demo-orders-service
    newTag: sha-66e7443
    digest: sha256:64bf5ecc39fba376baf0a7974e62e48bbb16d1c38f6dd7a9b7a35b568d360e29
replicas:
  - name: orders
    count: 1
configMapGenerator:
  - name: orders-config
    files:
      - env.yaml=../application.yaml # env-wide overrides (all services in stage)
      - service.yaml=application.yaml # orders overrides in stage
