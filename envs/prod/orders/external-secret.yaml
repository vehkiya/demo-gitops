# Pulls the payment API key from OpenBao (secret/demo/prod/orders). The resulting Secret is loaded with envFrom;
# Spring's relaxed binding maps ORDERS_PAYMENT_APIKEY to orders.payment.api-key.
# EKS: secretStoreRef -> the cluster's AWS Secrets Manager store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: orders-secrets
  data:
    - secretKey: ORDERS_PAYMENT_APIKEY
      remoteRef:
        key: demo/prod/orders
        property: payment-api-key
